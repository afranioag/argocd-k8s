apiVersion: apps/v1
kind: Deployment
metadata:
  name: v3-app-deployment
  namespace: default
  labels:
    app: v3-app
    version: v3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: v3-app
  template:
    metadata:
      labels:
        app: v3-app
    spec:
      containers:
      - name: v3-app-container
        image: afranio653/app-argo-k8s:v3
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
